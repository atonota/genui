name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The whole Adaptive UI workflow gates this same revision before any Pages build.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/adaptive-ui.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: npm ci
      - name: FAB contract and motion gates
        run: node --test docs/tests/fab.test.mjs docs/tests/component-motion.test.mjs docs/tests/interaction-stability.test.mjs
      - name: Build GenUX documentation for /genux/
        run: npm run docs:build
        env:
          GENUX_DOCS_PAGES: '1'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs/pages/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
